<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification - TechStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .countdown { font-weight: bold; color: #dc3545; }
        .disabled { cursor: not-allowed; opacity: 0.65; }
    </style>
</head>
<body>
    <section class="vh-100" style="background-color: #eee;">
        <div class="container h-100">
            <div class="row d-flex justify-content-center align-items-center h-100">
                <div class="col-lg-12 col-xl-11">
                    <div class="card text-black" style="border-radius: 25px;">
                        <div class="card-body p-md-5">
                            <div class="row justify-content-center">
                                <div class="col-md-10 col-lg-6 col-xl-5 order-2 order-lg-1">
                                    <p class="text-center h1 fw-bold mb-5 mx-1 mx-md-4 mt-4">OTP Verification</p>
                                    <p class="text-center mb-4">A one-time password has been sent to <strong>{{ email }}</strong>. It is valid for <span class="countdown" id="countdown">3:00</span>.</p>
                                    
                                    {% if messages %}
                                    {% for message in messages %}
                                    <div class="alert alert-{% if message.tags == 'success' %}success{% else %}danger{% endif %} text-center" role="alert">
                                        {{ message }}
                                    </div>
                                    {% endfor %}
                                    {% endif %}

                                    <form class="mx-1 mx-md-4" method="post" id="otp-form">
                                        {% csrf_token %}
                                        <div class="d-flex flex-row align-items-center mb-4">
                                            <i class="fas fa-key fa-lg me-3 fa-fw"></i>
                                            <div class="form-outline flex-fill mb-0">
                                                <input type="text" id="otp" name="otp" class="form-control" required pattern="[0-9]{6}" title="Enter a 6-digit OTP" />
                                                <label class="form-label" for="otp">Enter OTP</label>
                                            </div>
                                        </div>
                                        <div class="d-flex justify-content-center mx-4 mb-3 mb-lg-4">
                                            <button type="submit" class="btn btn-primary btn-lg">Verify</button>
                                        </div>
                                    </form>

                                    <div class="d-flex justify-content-center mb-4">
                                        <button id="resend-otp" class="btn btn-secondary btn-lg" disabled>Resend OTP</button>
                                    </div>
                                    <div class="form-check d-flex justify-content-center mb-5">
                                        <a href="{% url 'sign_up' %}">Create a new account</a>
                                    </div>
                                </div>
                                <div class="col-md-10 col-lg-6 col-xl-7 d-flex align-items-center order-1 order-lg-2">
                                    <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-registration/draw1.webp" class="img-fluid" alt="TechStore OTP Verification">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <script>
        // Countdown timer (3 minutes = 180 seconds)
        let timeLeft = 180;
        const countdownElement = document.getElementById('countdown');
        function updateCountdown() {
            if (timeLeft <= 0) {
                countdownElement.textContent = 'Expired';
                return;
            }
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            countdownElement.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            timeLeft--;
            setTimeout(updateCountdown, 1000);
        }
        updateCountdown();

        // Enable resend button after 1 minute (60 seconds)
        setTimeout(() => {
            document.getElementById('resend-otp').removeAttribute('disabled');
            document.getElementById('resend-otp').classList.remove('disabled');
        }, 60000);

        // Handle OTP form submission via AJAX
        $('#otp-form').on('submit', function(e) {
            e.preventDefault();
            const otp = $('#otp').val();
            $.ajax({
                url: '{% url 'otp' %}',
                type: 'POST',
                data: { otp: otp, csrfmiddlewaretoken: '{{ csrf_token }}' },
                success: function(response) {
                    if (response.redirect) {
                        window.location.href = response.redirect;
                    } else {
                        const alertClass = response.status === 'success' ? 'alert-success' : 'alert-danger';
                        const alert = `<div class="alert ${alertClass} text-center" role="alert">${response.message}</div>`;
                        $('.alert').remove();
                        $('#otp-form').before(alert);
                        if (response.status === 'success') {
                            setTimeout(() => { window.location.href = '{% url 'login' %}'; }, 1000);
                        }
                    }
                },
                error: function() {
                    const alert = '<div class="alert alert-danger text-center" role="alert">An error occurred. Please try again.</div>';
                    $('.alert').remove();
                    $('#otp-form').before(alert);
                }
            });
        });

        // Handle resend OTP via AJAX
        $('#resend-otp').on('click', function() {
            const button = $(this);
            button.prop('disabled', true).addClass('disabled');
            $.ajax({
                url: '{% url 'resend_otp' %}',
                type: 'POST',
                data: { csrfmiddlewaretoken: '{{ csrf_token }}' },
                success: function(response) {
                    const alertClass = response.status === 'success' ? 'alert-success' : 'alert-danger';
                    const alert = `<div class="alert ${alertClass} text-center" role="alert">${response.message}</div>`;
                    $('.alert').remove();
                    $('#otp-form').before(alert);
                    if (response.status === 'success') {
                        timeLeft = 180; // Reset countdown
                        updateCountdown();
                        setTimeout(() => {
                            button.prop('disabled', false).removeClass('disabled');
                        }, 60000); // Re-enable after 1 minute
                    }
                },
                error: function() {
                    button.prop('disabled', false).removeClass('disabled');
                    const alert = '<div class="alert alert-danger text-center" role="alert">Failed to resend OTP. Please try again.</div>';
                    $('.alert').remove();
                    $('#otp-form').before(alert);
                }
            });
        });
    </script>
</body>
</html>
