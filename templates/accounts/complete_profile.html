<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <section class="vh-100" style="background-color: #eee;">
        <div class="container h-100">
            <div class="row d-flex justify-content-center align-items-center h-100">
                <div class="col-lg-12 col-xl-11">
                    <div class="card text-black" style="border-radius: 25px;">
                        <div class="card-body p-md-5">
                            <p class="text-center h1 fw-bold mb-5">Complete Your Profile</p>
                            {% if messages %}
                            {% for message in messages %}
                            <div class="alert alert-{% if message.tags %}{{ message.tags }}{% endif %} text-center" role="alert">
                                {{ message }}
                            </div>
                            {% endfor %}
                            {% endif %}
                            <p>Thank you for signing in with Google. We need just a bit more information to complete your profile.</p>
                            <form method="post">
                                {% csrf_token %}
                                <div class="form-outline mb-4">
                                    <label class="form-label">Email (from Google)</label>
                                    <input type="email" class="form-control" value="{{ email }}" disabled>
                                </div>
                                <div class="form-outline mb-4">
                                    <label class="form-label">Phone Number</label>
                                    <input type="tel" name="phone" class="form-control" required pattern="[0-9]{10}" title="Phone number must be exactly 10 digits" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10)" />
                                </div>
                                <div class="form-outline mb-4">
                                    <label class="form-label">Date of Birth</label>
                                    <input type="date" name="DOB" class="form-control" required max="{{ today|date:'Y-m-d' }}" />
                                </div>
                                <div class="d-flex justify-content-center">
                                    <button type="submit" class="btn btn-primary btn-lg">Save</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
