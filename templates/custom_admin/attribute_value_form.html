<!-- templates/custom_admin/attribute_value_form.html -->
{% extends "custom_admin/admin_base.html" %}
{% load static %}
{% block title %}{{ title }}{% endblock %}
{% block main %}
<section class="content-main">
    <div class="content-header">
        <h2 class="content-title">{{ title }} for {{ attribute.name }}</h2>
    </div>
    <div class="card mb-4">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Save Value</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
